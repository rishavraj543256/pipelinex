name: PipelineX CI
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm audit --audit-level high
      - run: npm run build
  containers:
    runs-on: ubuntu-latest
    env:
      AIRFLOW_DB_PASSWORD: ci-only
      AIRFLOW_SECRET_KEY: ci-only
      MINIO_ROOT_USER: ci-user
      MINIO_ROOT_PASSWORD: ci-password
      PIPELINEX_S3_ENDPOINT: http://minio:9000
      PIPELINEX_LAKEHOUSE: s3a://pipelinex/lakehouse
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build -f Dockerfile.api -t pipelinex-api:ci .
      - run: docker compose build airflow-init
      - name: Execute the Airflow DAG against MinIO and verify Delta objects
        run: |
          mkdir -p data/source
          printf '%s\n' '{"order_id":1,"customer_id":1,"product_id":1,"amount_cents":125}' > data/source/20261127.json
          docker compose up -d postgres minio
          python -m pip install minio
          python - <<'PY'
          from minio import Minio
          import os, time
          client = Minio("127.0.0.1:9000", os.environ["MINIO_ROOT_USER"], os.environ["MINIO_ROOT_PASSWORD"], secure=False)
          for attempt in range(15):
              try:
                  client.make_bucket("pipelinex")
                  break
              except Exception:
                  if attempt == 14:
                      raise
                  time.sleep(2)
          PY
          docker compose run --rm airflow-init db migrate
          docker compose run --rm airflow-init dags list
          docker compose run --rm airflow-init dags test pipelinex_retail 2026-11-27
          docker compose run --rm airflow-init dags test pipelinex_retail 2026-11-27
          python - <<'PY'
          from minio import Minio
          import os
          client = Minio("127.0.0.1:9000", os.environ["MINIO_ROOT_USER"], os.environ["MINIO_ROOT_PASSWORD"], secure=False)
          names = {item.object_name for item in client.list_objects("pipelinex", recursive=True)}
          for stage in ("bronze", "silver", "gold", "quarantine"):
              assert f"lakehouse/20261127/{stage}/_delta_log/00000000000000000000.json" in names, names
          PY
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pipelinex
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/pipelinex
      PIPELINEX_TEST_API: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-api.txt pytest httpx
      - run: alembic upgrade head
      - run: python -m pytest -q tests/test_api.py
  spark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r requirements-spark.txt pytest
      - run: python -m pytest -q
        env:
          PIPELINEX_TEST_SPARK: '1'
          SPARK_LOCAL_IP: 127.0.0.1
      - run: python bench_spark.py 1000 10000 100000 | tee spark-benchmark.json
        env:
          SPARK_LOCAL_IP: 127.0.0.1
      - uses: actions/upload-artifact@v4
        with:
          name: local-spark-benchmark
          path: spark-benchmark.json
