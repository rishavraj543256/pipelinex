x-airflow: &airflow
  build:
    context: .
    dockerfile: Dockerfile.spark
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD}@postgres/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?set AIRFLOW_SECRET_KEY}
    PIPELINEX_LAKEHOUSE: ${PIPELINEX_LAKEHOUSE:-/data/lakehouse}
    PIPELINEX_S3_ENDPOINT: ${PIPELINEX_S3_ENDPOINT:-}
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
  volumes:
    - ./data:/data
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 3s
      retries: 12
  airflow-init:
    <<: *airflow
    command: ["db", "migrate"]
  airflow-scheduler:
    <<: *airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: ["scheduler"]
  airflow-web:
    <<: *airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: ["webserver"]
    ports:
      - "127.0.0.1:8080:8080"
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/objects", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - objects:/objects
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
volumes:
  postgres:
  objects:
